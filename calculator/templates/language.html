
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Language - Window Glass Calculator</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #eaf4fa, #d4e9f5);
            padding: 20px;
        }

        .language-box {
            width: 100%;
            max-width: 430px;
            margin: auto;
            background: white;
            padding: 35px 25px;
            border-radius: 22px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(15, 61, 94, 0.15);
        }

        .logo {
            font-size: 55px;
            margin-bottom: 12px;
        }

        h1 {
            color: #0f3d5e;
            font-size: 25px;
            margin: 0 0 10px;
        }

        p {
            color: #64748b;
            margin-bottom: 28px;
        }

        .language-btn {
            display: block;
            width: 100%;
            padding: 17px;
            margin-top: 15px;
            border: none;
            border-radius: 12px;
            background: #1976a8;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
        }

        .language-btn:hover {
            background: #0f5f8f;
        }

        .marathi {
            background: #16834a;
        }

        .marathi:hover {
            background: #106b3b;
        }
    </style>
</head>

<body>

    <div class="language-box">

        <div class="logo">🪟</div>

        <h1>Window Glass Calculator</h1>

        <p>Select Your Language / आपली भाषा निवडा</p>

        <form method="POST" action="{% url 'set_language' %}">
            {% csrf_token %}

            <button class="language-btn marathi"
                    type="submit"
                    name="language"
                    value="mr">
                मराठी
            </button>

            <button class="language-btn"
                    type="submit"
                    name="language"
                    value="en">
                English
            </button>

        </form>

    </div>

</body>
</html>
